name: CI

on:
  push:
  pull_request:

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y PROBAR
        run: ./mvnw -B test

      - name: Construir la imagen
        run: docker build -t tareasapplication:${{ github.sha }} .
